services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: betriebsradar
      POSTGRES_PASSWORD: betriebsradar
      POSTGRES_DB: betriebsradar
    ports:
      - "5432:5432"
    volumes:
      - betriebsradar-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betriebsradar -d betriebsradar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  betriebsradar-db:
